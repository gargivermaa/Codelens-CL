# Full local stack:   docker compose up --build        -> dashboard at http://localhost:8000
# With the webhook tunnel (GitHub -> your laptop):  docker compose --profile tunnel up --build
#
# Secrets (GITHUB_WEBHOOK_SECRET, GEMINI_API_KEY, GITHUB_APP_ID, ...) come from .env.
# The GitHub App private key goes in ./secrets/github_app.pem (git- and docker-ignored).
# Service URLs below override the localhost values in .env.
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codelens
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    QDRANT_PATH: ""
    GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app.pem
    LOG_FORMAT: json
  volumes:
    - ./secrets:/run/secrets:ro
    - ./benchmarks/results:/app/benchmarks/results
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codelens
    ports:
      - "5432:5432"   # reachable from the host for alembic, pytest and the CLI
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codelens"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Forwards GitHub webhooks from a free smee.io channel to the API (no public IP needed).
  # Set SMEE_URL in .env to your channel from https://smee.io/new
  tunnel:
    image: node:22-alpine
    profiles: ["tunnel"]
    env_file: .env
    command: ["sh", "-c", "test -n \"$$SMEE_URL\" || { echo 'Set SMEE_URL in .env (https://smee.io/new)'; exit 1; }; exec npx --yes smee-client@2.0.4 --url \"$$SMEE_URL\" --target http://api:8000/webhook"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  qdrant_data:
